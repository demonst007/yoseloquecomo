<style>
:root{--bg:#EDEFF2;--card:#fff;--ink:#16213A;--mut:#5B6577;--acc:#2745D6;--on:#fff;--ok:#0F8B6D;--ln:#D9DEE7;--t:#2745D6;--z:1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--card:#18213A;--ink:#E8ECF5;--mut:#9AA5BC;--acc:#8EA2FF;--on:#0F1626;--ok:#4CC9A4;--ln:#2A3556;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1626;--card:#18213A;--ink:#E8ECF5;--mut:#9AA5BC;--acc:#8EA2FF;--on:#0F1626;--ok:#4CC9A4;--ln:#2A3556;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,color-mix(in srgb,var(--t) 18%,var(--bg)),var(--bg) 280px) no-repeat,var(--bg);color:var(--ink);font:400 16px/1.45 var(--ff,Barlow),system-ui,sans-serif;padding:16px 14px 84px;max-width:560px;margin-inline:auto}
h1,h2,.big{font-family:var(--fd,"Barlow Condensed"),"Arial Narrow",sans-serif;font-weight:700;margin:0}
h1{font-size:30px;background:linear-gradient(90deg,var(--acc),var(--t));-webkit-background-clip:text;background-clip:text;color:transparent}h2{font-size:20px;margin:18px 0 8px;color:var(--t)}
.card{background:var(--card);border:1px solid var(--ln);border-top:3px solid var(--t);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.big{font-size:40px;line-height:1}.mut{color:var(--mut);font-size:14px}
a{color:var(--acc)}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:3px 0 9px}.bar i{display:block;height:100%;background:var(--t)}
.bar.o i{background:var(--ok)}.bar.w i{background:#C98A1B}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;min-width:0}
input{flex:1 1 70px}
button{cursor:pointer;background:var(--acc);color:var(--on);border:0;font-weight:600}
button.g{background:var(--bg);color:var(--ink);border:1px solid var(--ln)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label.b{position:relative;display:inline-block;cursor:pointer;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;font-weight:600}
.hid{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.item{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--ln)}
.item:first-child{border-top:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--ln)}
nav button svg{display:none}nav button::before{font-size:19px;line-height:1.1}#b0::before{content:"🍽️"}#b1::before{content:"⚖️"}#b2::before{content:"🏋🏻‍♀️"}#b3::before{content:"🗓️"}nav button{padding:6px 2px;flex:1;display:flex;flex-direction:column;align-items:center;gap:0;font-size:13px;background:var(--bg);color:var(--mut);border:1px solid var(--ln)}
nav button.on{background:var(--t);color:#fff;border-color:var(--t)}body>*:not(nav):not(#tmr):not(#mdl):not(#qp){zoom:var(--z)}
.tip{border-left:4px solid var(--t);padding-left:10px;margin:8px 0}
svg{width:100%;height:auto;display:block}
summary{cursor:pointer;font-weight:600}
[hidden]{display:none!important}
img.ph{width:100%;max-height:300px;object-fit:cover;border-radius:8px;margin-top:8px}
#tmr{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--on);font-weight:600;text-align:center;border-radius:10px;padding:10px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.sh{font-weight:700;margin:12px 0 4px;color:var(--t)}button.chip{border-radius:20px;padding:6px 12px;border:1px solid var(--ln);background:transparent;color:inherit}button.chip.on{background:var(--t);color:#fff;border-color:var(--t)}.lg{color:var(--mut);font-size:.85em}.ic{touch-action:pan-y;user-select:none}


.hero,.card.hero{border-radius:20px;padding:16px;margin:10px 0;background:linear-gradient(135deg,var(--t),color-mix(in srgb,var(--t) 45%,#000));color:#fff;border:0;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.hero .big{color:#fff}.hero .mut{color:rgba(255,255,255,.85)}.hero .tip{border-left-color:#fff}
.hero select,.hero input{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35)}.hero select option{color:#16213A}.hero input::placeholder{color:rgba(255,255,255,.75)}.hero input[type=date]{color-scheme:dark}
.hero button.g{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.35)}.hero button:not(.g){background:#fff;color:#16213A}

/* PREMIUM 2 */
:root{--sh:0 1px 0 rgba(255,255,255,.9) inset,0 22px 44px -22px color-mix(in srgb,var(--t) 55%,transparent),0 3px 8px rgba(16,24,40,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070B16;--card:#0F1729;--ln:#1E2845;--sh:0 1px 0 rgba(255,255,255,.06) inset,0 22px 44px -22px color-mix(in srgb,var(--t) 50%,#000),0 3px 8px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#070B16;--card:#0F1729;--ln:#1E2845;--sh:0 1px 0 rgba(255,255,255,.06) inset,0 22px 44px -22px color-mix(in srgb,var(--t) 50%,#000),0 3px 8px rgba(0,0,0,.5)}
body{background:radial-gradient(70% 38% at 100% -4%,color-mix(in srgb,var(--t) 42%,transparent),transparent 72%),radial-gradient(55% 34% at -12% 32%,color-mix(in srgb,var(--t) 18%,transparent),transparent 72%),var(--bg);background-attachment:fixed;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:100px}
body .card{background:linear-gradient(90deg,var(--t),transparent 75%) top/100% 2px no-repeat,linear-gradient(180deg,color-mix(in srgb,var(--card) 94%,#fff),var(--card));border:1px solid color-mix(in srgb,var(--ln) 80%,transparent);border-radius:22px;box-shadow:var(--sh);padding:16px;margin:14px 0}
h2{display:flex;align-items:center;gap:9px;font-size:23px;letter-spacing:.02em;margin:24px 0 8px}
h2::before{content:"";width:4px;height:20px;border-radius:4px;background:linear-gradient(var(--t),color-mix(in srgb,var(--t) 40%,#fff))}
.big{letter-spacing:-.015em}.mut{letter-spacing:.01em}.sh{letter-spacing:.03em}
.hero,.card.hero{position:relative;overflow:hidden;border-radius:26px!important;padding:20px!important;border:0!important;background:linear-gradient(140deg,color-mix(in srgb,var(--t) 72%,#fff) -25%,var(--t) 38%,color-mix(in srgb,var(--t) 38%,#000) 115%)!important;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 26px 46px -20px color-mix(in srgb,var(--t) 80%,#000),0 4px 10px rgba(0,0,0,.18)!important}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 70% at 105% -10%,rgba(255,255,255,.34),transparent 60%),radial-gradient(70% 60% at -10% 110%,rgba(0,0,0,.3),transparent 65%)}
.hero::after{content:"";position:absolute;top:0;bottom:0;left:0;width:55%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.26),transparent);transform:translateX(-130%)}
.hero .big{text-shadow:0 6px 22px rgba(0,0,0,.28)}
input,select{background:color-mix(in srgb,var(--ink) 5%,var(--card));border:1px solid color-mix(in srgb,var(--ln) 70%,transparent);border-radius:13px;padding:11px 13px;box-shadow:inset 0 1px 2px rgba(0,0,0,.07);transition:box-shadow .2s,border-color .2s}
input:focus,select:focus{border-color:var(--t);box-shadow:0 0 0 4px color-mix(in srgb,var(--t) 24%,transparent);outline:0}
.ctl{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:12px}.ctl .cr{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}.ctl~.mut{text-align:center}
.ctl input,.ctl select,.ctl button.g{border:1.5px solid color-mix(in srgb,var(--t) 38%,transparent);box-shadow:0 0 8px -2px color-mix(in srgb,var(--t) 45%,transparent);transition:box-shadow .25s,border-color .25s}
.ctl input,.ctl select{text-align:center;text-align-last:center}.ctl select{width:100%;max-width:340px}.ctl input[type=date]{flex:0 1 190px;min-width:0}
.ctl select,.ctl .dpill{background:#fff!important;color:#000!important}.ctl select option{background:#fff;color:#000}.ctl .dpill .dw{color:#333}.ctl .dpill .dm{color:#000}.ctl .dpill::after{border-color:#333}
.ctl select{font-weight:700!important}.ctl .dpill .dw{font-weight:700}
.ctl .dpill::before{content:"";position:absolute;left:10px;top:50%;width:29px;height:34px;transform:translateY(-50%);background:var(--wmb) center/contain no-repeat;pointer-events:none}
.ctl .dpill .dm{max-width:calc(100% - 92px);font-size:clamp(17px,5.4vw,22px)}
.ctl input:focus,.ctl select:focus,.ctl button.g:active,.ctl button.g:focus-visible{border-color:var(--t);outline:0;box-shadow:0 0 0 1px var(--t),0 0 10px var(--t),0 0 24px color-mix(in srgb,var(--t) 65%,transparent),0 0 46px color-mix(in srgb,var(--t) 35%,transparent)}
.rg{position:relative;width:176px;height:176px;margin:0 auto}.rg svg{display:block;transform:rotate(-90deg)}.rg .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sc{display:flex;justify-content:center;gap:10px;margin-top:12px}.sc .sb{width:68px;padding:7px 0 6px!important;border-radius:11px!important;background:rgba(255,255,255,.14)!important;box-shadow:none!important;border:1px solid rgba(255,255,255,.28)!important;color:#fff!important;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}.sc .sb.on{background:rgba(255,255,255,.3)!important;border-color:rgba(255,255,255,.75)!important}.sc .sb svg{width:18px;height:18px}
.mtabs{display:flex;gap:8px;justify-content:center;margin:0 0 12px}
body .mcard{--ink:#fff;--mut:rgba(255,255,255,.72);--ln:rgba(255,255,255,.18);--t:#B69CFF;--card:rgba(255,255,255,.08);color:#fff;background:linear-gradient(135deg,#17356f 0%,#2f2a78 52%,#53297f 100%)!important;border:1px solid rgba(255,255,255,.16)!important;border-radius:22px!important;box-shadow:0 18px 40px -18px rgba(40,20,120,.7)!important}
.mct{text-align:center;font:700 14px var(--fd,"Barlow Condensed"),sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.78);margin-bottom:12px}
.mg{display:grid;grid-template-columns:1.05fr .95fr;gap:8px;align-items:center}
.mli{display:flex;justify-content:space-between;gap:6px;padding:6px 9px;border-radius:10px;cursor:pointer;font-size:15px}.mli span{color:rgba(255,255,255,.78)}.mli b{font-weight:700}.mli.on{background:rgba(255,255,255,.17);box-shadow:inset 0 0 0 1px rgba(255,255,255,.42)}
.mdt{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.1)}.mdt .mv{font-size:24px;font-weight:700;margin-left:8px}
.mev{margin-top:12px}.mevt{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);margin-bottom:4px}
.qa{margin-top:14px;padding:10px;border-radius:16px;background:rgba(139,92,246,.35);border:1px solid rgba(255,255,255,.18)}.qat{text-align:center;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.qab{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qab button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px!important;border-radius:11px!important;background:rgba(255,255,255,.14)!important;color:#fff!important;border:1px solid rgba(255,255,255,.25)!important;box-shadow:none!important;font-size:12px;line-height:1.15;text-align:center}.qab button.on{background:rgba(255,255,255,.32)!important;border-color:#fff!important}.qab svg{width:20px;height:20px}
.mfm{margin-top:12px}
.hin{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.28);--ink:#fff;--mut:rgba(255,255,255,.78);--ln:rgba(255,255,255,.24);--t:#fff;--card:rgba(255,255,255,.1);color:#fff}.hin .wkb{margin-bottom:14px}.fpg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}.fpg .chip{min-width:36px;text-align:center}.fpg .chip:disabled{opacity:.35}.wkc{display:flex;justify-content:space-around;margin:2px 0 12px}.wkd{display:flex;flex-direction:column;align-items:center;gap:4px}.wkd small{font-size:12.5px;color:var(--mut)}.wkd i{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;font-weight:700;color:#fff}.wkd i.on{background:#2DA44E;border-color:#2DA44E}.wkd i.hoy{box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 35%,transparent)}.hin .evl{margin-top:4px}.hin .evl .tip{background:rgba(255,255,255,.14)!important;color:#fff!important;border-color:rgba(255,255,255,.3)!important}

.mi{width:62px!important;text-align:right;background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.28)!important;border-radius:8px!important;padding:3px 7px!important;color:#fff!important;font-weight:700;font-size:15px;margin:0!important;transition:box-shadow .25s,border-color .25s}.mi:focus{border-color:#fff!important;outline:0;box-shadow:0 0 0 1px #fff,0 0 10px #B69CFF,0 0 22px rgba(182,156,255,.7)}.mvl{display:flex;align-items:center;gap:5px}.mvl em{font-style:normal;color:rgba(255,255,255,.7);font-size:13px}
body .mcard .wt{background:rgba(255,255,255,.08)!important;border-radius:14px!important;border:1px solid rgba(255,255,255,.14)!important;box-shadow:none!important}.mrow{cursor:pointer;border-radius:10px;padding-left:8px!important;padding-right:8px!important}.mrow.on{background:color-mix(in srgb,var(--t) 18%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--t) 55%,transparent)}
.wt{padding:6px 10px!important}.wh,.wr{display:grid;grid-template-columns:82px 1fr 1.2fr 34px;gap:6px;align-items:center;font-size:13px}.wh{padding:6px 2px 8px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t);font-weight:700;border-bottom:1px solid color-mix(in srgb,var(--t) 40%,transparent)}.wr{padding:9px 2px;border-bottom:1px solid color-mix(in srgb,var(--ln) 70%,transparent)}.wr:last-child{border-bottom:0}.wr .mut{font-size:13.5px;line-height:1.3}.wr button.g{padding:5px 0!important;border-radius:9px!important;font-size:13px}
button{border-radius:13px;transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
button:active{transform:scale(.95)}
main button:not(.g):not(.chip){background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc) 45%,color-mix(in srgb,var(--acc) 72%,#000));box-shadow:0 10px 20px -10px var(--acc),0 1px 0 rgba(255,255,255,.35) inset;padding:10px 14px}
main .hero button:not(.g){background:#fff;color:#16213A;box-shadow:0 10px 20px -10px rgba(0,0,0,.45)}
button.g{background:color-mix(in srgb,var(--ink) 6%,var(--card));box-shadow:none}
button.chip{border-radius:999px;padding:7px 14px}button.chip.on{background:linear-gradient(135deg,color-mix(in srgb,var(--t) 80%,#fff),var(--t));box-shadow:0 8px 16px -8px var(--t)}
.bar{height:12px;border-radius:8px;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.bar i{border-radius:8px;transform-origin:left;background-image:linear-gradient(180deg,rgba(255,255,255,.38),transparent 65%),linear-gradient(90deg,transparent 60%,rgba(255,255,255,.25))}
.bar.o i,.bar.w i{background-image:linear-gradient(180deg,rgba(255,255,255,.38),transparent 65%)}
.item{border-top:1px solid color-mix(in srgb,var(--ln) 55%,transparent);padding:10px 0}
.tip{border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--t) 9%,transparent);padding:9px 12px}
img.ph{border-radius:16px}
nav{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:540px;margin-inline:auto;padding:6px;gap:4px;border-radius:26px;background:color-mix(in srgb,var(--card) 74%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid color-mix(in srgb,var(--ln) 70%,transparent);box-shadow:0 18px 40px -12px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.12) inset}
nav button{background:transparent!important;border:0!important;border-radius:20px;box-shadow:none!important;transition:background .3s ease,color .3s ease,transform .15s ease}
nav button.on{background:linear-gradient(135deg,color-mix(in srgb,var(--t) 75%,#fff),var(--t) 45%,color-mix(in srgb,var(--t) 65%,#000))!important;color:#fff;box-shadow:0 10px 20px -8px var(--t)!important;transform:translateY(-1px)}
@keyframes fillx{from{transform:scaleX(0)}}@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}}@keyframes sweep{to{transform:translateX(330%)}}
.sw .bar i{animation:fillx .9s cubic-bezier(.2,.8,.2,1) both}
.sw #v>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.sw #v>*:nth-child(2){animation-delay:.06s}.sw #v>*:nth-child(3){animation-delay:.12s}.sw #v>*:nth-child(4){animation-delay:.18s}.sw #v>*:nth-child(5){animation-delay:.24s}.sw #v>*:nth-child(n+6){animation-delay:.3s}
.sw .hero::after{animation:sweep 1.3s .3s ease}
@media(prefers-reduced-motion:reduce){.sw .bar i,.sw #v>*,.sw .hero::after{animation:none}}
/* PREMIUM 3 */
@property --t{syntax:'<color>';inherits:true;initial-value:#2745D6}
@property --mx{syntax:'<percentage>';inherits:false;initial-value:105%}
@property --my{syntax:'<percentage>';inherits:false;initial-value:-10%}
:root{transition:none}
h2{text-transform:uppercase;font-style:italic;letter-spacing:.07em;font-size:21px}
.hero .big{font-style:italic}
.hero,.card.hero{background-size:180% 180%!important;animation:drift 14s ease-in-out infinite alternate}
.hero::before{background:radial-gradient(65% 65% at var(--mx) var(--my),rgba(255,255,255,.42),transparent 62%),radial-gradient(70% 60% at -10% 110%,rgba(0,0,0,.3),transparent 65%);animation:breathe 6s ease-in-out infinite alternate}
.bar i{position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-100%);animation:shim 3s ease-in-out infinite}
nav::before{content:"";position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 24px)/4);border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--t) 75%,#fff),var(--t) 45%,color-mix(in srgb,var(--t) 65%,#000));box-shadow:0 10px 20px -8px var(--t);transform:translateX(calc(var(--i,0)*(100% + 4px)));transition:transform .5s cubic-bezier(.3,1.45,.5,1)}
nav button{position:relative;z-index:1}
nav button.on{background:transparent!important;box-shadow:none!important;transform:none}
nav button.on::before{animation:pop .55s ease}
#v>*{transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1),--mx .35s ease-out,--my .35s ease-out}
#v>*.pre{opacity:0;transform:translateY(26px) scale(.97)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rpl .65s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(1);opacity:0}}@keyframes shim{60%,100%{transform:translateX(100%)}}@keyframes drift{to{background-position:100% 100%}}@keyframes breathe{to{opacity:.65;transform:scale(1.12)}}@keyframes pop{40%{transform:scale(1.4) rotate(-8deg)}}
@media(prefers-reduced-motion:reduce){.hero,.bar i::after,.hero::before,nav button.on::before{animation:none}}

h1{display:flex;align-items:center;gap:10px}
h1::before{content:"";flex:none;width:44px;height:44px;border-radius:13px;background:var(--logo) center/cover;box-shadow:0 0 0 1px rgba(124,252,0,.35),0 8px 18px -6px rgba(124,252,0,.45)}
#sp{position:fixed;inset:0;z-index:99999;zoom:1!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(60% 45% at 50% 45%,#16210a,#000 70%);transition:opacity .7s ease,visibility .7s}
#sp.out{opacity:0;visibility:hidden;pointer-events:none}
#sp .lg{width:min(72vw,320px);aspect-ratio:1;border-radius:36px;background:var(--logo) center/cover;box-shadow:0 0 0 2px #7CFC00,0 0 16px 4px rgba(124,252,0,.95),0 0 46px 12px rgba(124,252,0,.7),0 0 110px 32px rgba(57,255,20,.45);animation:lgin 1s cubic-bezier(.2,.9,.3,1.25) both,lgp .9s .3s ease-in-out infinite alternate}
#sp .sb{display:block;width:min(48vw,200px);height:3px;border-radius:3px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
#sp .sb::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#7CFC00,#C6FF4D);transform:scaleX(0);transform-origin:left;animation:sbf 1.5s .2s ease-out forwards}
@keyframes lgin{from{opacity:0;transform:scale(.6) rotate(-6deg);filter:blur(10px)}}@keyframes lgp{to{box-shadow:0 0 0 2px #B6FF4D,0 0 26px 8px rgba(150,255,40,1),0 0 70px 20px rgba(124,252,0,.85),0 0 150px 48px rgba(57,255,20,.6)}}@keyframes sbf{to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){#sp .lg,#sp .sb::after{animation:none}#sp .sb::after{transform:none}}
/* MODO ENTRENO + CELEBRACION */
body{transition:none}#tmr{z-index:100000}
#wm{width:100%;margin:12px 0;padding:15px;font-size:19px;font-family:var(--fd,"Barlow Condensed"),sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.06em}
#wo{position:fixed;inset:0;z-index:9000;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;background:radial-gradient(80% 45% at 50% 0,color-mix(in srgb,var(--t) 45%,transparent),transparent 70%),var(--bg);display:flex;flex-direction:column;gap:14px}
#wo>*{flex-shrink:0}#wo .wt{display:flex;justify-content:space-between;align-items:center;gap:8px}
#wo .wn{font:700 38px/1.05 var(--fd,"Barlow Condensed"),sans-serif;font-style:italic;text-transform:uppercase;margin-top:10px}
#wo .wc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0}
#wo .wc>div{background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--ln);border-radius:22px;padding:14px;text-align:center;box-shadow:var(--sh)}
#wo .wc span{font-size:13px;letter-spacing:.14em;color:var(--mut)}
#wo .wc .row{justify-content:space-between;flex-wrap:nowrap;margin-top:6px}
#wo .wc b{font:700 54px/1 var(--fd,"Barlow Condensed"),sans-serif;font-style:italic}
#wo .wc button{width:50px;height:50px;border-radius:50%;font-size:26px;padding:0}
#wo .wd{width:100%;padding:20px;font-size:24px;font-family:var(--fd,"Barlow Condensed"),sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.06em;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--t) 75%,#fff),var(--t),color-mix(in srgb,var(--t) 65%,#000));color:#fff;box-shadow:0 16px 30px -12px var(--t);margin-top:auto}
.ct{position:fixed;top:16%;left:50%;translate:-50% 0;z-index:100002;padding:11px 24px;border-radius:999px;background:linear-gradient(135deg,#C6FF4D,#7CFC00);color:#0a1200;font:700 26px var(--fd,"Barlow Condensed"),sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.05em;box-shadow:0 14px 40px -8px rgba(124,252,0,.7);white-space:nowrap;animation:ctin 2.4s ease both}
@keyframes ctin{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
/* MODO ENTRENO 2 */
.wob #tmr{display:none!important}
#wo .wi{width:100%;font:700 56px/1 var(--fd,"Barlow Condensed"),sans-serif;font-style:italic;text-align:center;background:transparent;border:0;box-shadow:none;padding:6px 0;margin-top:4px;color:var(--ink)}
#wo .wcd{font:700 100px/1 var(--fd,"Barlow Condensed"),sans-serif;font-style:italic;text-align:center;margin:12px 0}
/* SLIDER FOTOS */
.ba{position:relative;aspect-ratio:3/4;max-height:460px;width:100%;margin:6px auto 0;border-radius:18px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;box-shadow:var(--sh)}
